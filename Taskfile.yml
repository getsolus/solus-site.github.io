version: "3"

set: [pipefail]

tasks:
  # Ensure people new to go-task and used to 'make help' have an easier time
  help:
    desc: Show how to list available tasks
    cmds:
      - |
        echo "Use 'go-task -l/--list' to list available tasks."

  build:
    desc: Build Solus website, including CSS
    cmds:
      - npm run build

  dev:
    deps:
      - build
    desc: Start development server for Solus website
    cmds:
      - npm run dev

  deploy:
    desc: Trigger a GH Pages deployment by pushing a new tag for the latest commit in main branch. Don't repeatedly tag the same commit with this task, start the deploy Action if needed.
    preconditions:
      - sh: git switch main
      - sh: git pull origin main
    vars:
      NEW_VERSION_NUMBER:
        sh: git describe --tags --abbrev=0  | cut --delimiter "v" --fields 2- | xargs -n 1 expr 1 + # get the latest tag | trim off "v" | increment the result by 1
    cmds:
      - git tag -a v{{.NEW_VERSION_NUMBER}} -m ""
      - git push --tags
